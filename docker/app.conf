ServerName localhost
ServerTokens Prod
ServerSignature Off

# One origin serves both the React build and the PHP API, so the browser needs no CORS.
<Directory ${APACHE_DOCUMENT_ROOT}>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    RewriteEngine On
    # hand the Authorization header (Bearer token) to PHP
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    # /api/... -> PHP front controller
    RewriteRule ^api(/.*)?$ index.php [L]
    # any other path that is not a real file -> the React app (client-side routing, e.g. /product/elden-ring)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.html [L]
</Directory>
