# Render Blueprint: one Docker web service (API + website) and one Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: keyhub-db
    plan: free
    databaseName: keystore
    user: keystore
    ipAllowList: []          # only the web service (private network) can connect

services:
  - type: web
    name: keyhub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: keyhub-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: keyhub-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: keyhub-db, property: database }
      - key: DB_USER
        fromDatabase: { name: keyhub-db, property: user }
      - key: DB_PASS
        fromDatabase: { name: keyhub-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: APP_KEY           # encrypts the game keys; never change it after the first deploy
        generateValue: true
      - key: AUTO_SEED         # create schema + demo data on first start (free plan has no shell)
        value: "true"
