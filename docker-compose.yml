version: "1"
projects:
  - name: My project
    environments:
      - name: Production
        services:
          - type: web
            name: eneba_clone
            runtime: docker
            repo: https://github.com/Juztelis/eneba_clone
            plan: free
            envVars:
              - key: CORS_ORIGINS
                sync: false
              - key: APP_KEY
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: DB_PASS
                sync: false
              - key: DB_USER
                sync: false
              - key: DB_NAME
                sync: false
              - key: DB_PORT
                sync: false
              - key: DB_HOST
                sync: false
            region: frankfurt
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
